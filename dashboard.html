<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent 调用监控</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f7fa;
    color: #333;
    padding: 20px;
  }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .card {
    background: #fff; border-radius: 12px; padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-2px); }
  .card-label { font-size: 13px; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .card-value { font-size: 28px; font-weight: 700; color: #1a1a2e; }
  .card-delta { font-size: 13px; color: #666; margin-top: 4px; }
  .section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .section h2 { font-size: 18px; margin-bottom: 16px; color: #1a1a2e; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
  th { font-weight: 600; color: #666; background: #fafbfc; }
  tr:hover { background: #f8f9fa; }
  .rank { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; font-size: 12px; font-weight: 700; color: #fff; }
  .rank-1 { background: #ff6b6b; }
  .rank-2 { background: #feca57; }
  .rank-3 { background: #48dbfb; }
  .rank-other { background: #c8d6e5; color: #576574; }
  .chart-container { position: relative; height: 300px; }
  canvas { width: 100% !important; height: 100% !important; }
  .empty { text-align: center; padding: 40px; color: #888; }
  .refresh-btn {
    position: fixed; top: 20px; right: 20px;
    background: #1a1a2e; color: #fff; border: none;
    padding: 10px 20px; border-radius: 8px; cursor: pointer;
    font-size: 14px; transition: background 0.2s;
  }
  .refresh-btn:hover { background: #2d2d44; }
  .config-bar {
    background: #fff; border-radius: 12px; padding: 16px 20px;
    margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
  }
  .config-bar label { font-size: 13px; color: #666; }
  .config-bar input {
    border: 1px solid #ddd; border-radius: 6px; padding: 6px 10px;
    font-size: 14px; width: 200px;
  }
  .config-bar input:focus { outline: none; border-color: #1a1a2e; }
</style>
</head>
<body>

<button class="refresh-btn" onclick="loadData()">刷新数据</button>

<h1>AI Agent 调用监控面板</h1>
<p class="subtitle">数据来源：<code id="log-path">api_logs.jsonl</code> | 共 <span id="total-records">0</span> 条记录</p>

<div class="config-bar">
  <div>
    <label>日志文件路径：</label>
    <input type="text" id="logFileInput" value="api_logs.jsonl" onchange="updateLogPath()">
  </div>
  <div>
    <label>成本换算：$1 = </label>
    <input type="number" id="costRateInput" value="1000000" step="100000" onchange="updateCostRate()" style="width:120px;">
    <label>tokens</label>
  </div>
</div>

<!-- 总览卡片 -->
<div class="cards">
  <div class="card">
    <div class="card-label">总调用次数</div>
    <div class="card-value" id="total-calls">0</div>
    <div class="card-delta" id="calls-delta">成功 0 / 失败 0</div>
  </div>
  <div class="card">
    <div class="card-label">总 Token 消耗</div>
    <div class="card-value" id="total-tokens">0</div>
    <div class="card-delta" id="tokens-delta">输入 0 + 输出 0</div>
  </div>
  <div class="card">
    <div class="card-label">估算总成本</div>
    <div class="card-value" id="total-cost">$0.0000</div>
    <div class="card-delta">按当前换算率计算</div>
  </div>
  <div class="card">
    <div class="card-label">平均延迟</div>
    <div class="card-value" id="avg-latency">0.00s</div>
    <div class="card-delta">所有成功调用</div>
  </div>
</div>

<!-- 排行 -->
<div class="section">
  <h2>排行 — Token 消耗 Top 5 Agent</h2>
  <div id="ranking-container">
    <table>
      <thead>
        <tr><th>排名</th><th>Agent ID</th><th>总 Tokens</th><th>估算成本 ($)</th><th>调用次数</th><th>平均延迟 (s)</th></tr>
      </thead>
      <tbody id="ranking-body"></tbody>
    </table>
  </div>
</div>

<!-- 趋势 -->
<div class="section">
  <h2>趋势 — 过去 24 小时 Token 消耗</h2>
  <div class="chart-container">
    <canvas id="trendChart"></canvas>
  </div>
</div>

<script>
// 配置
let LOG_FILE = 'api_logs.jsonl';
let COST_PER_DOLLAR = 1000000;

// 更新配置
function updateLogPath() {
  LOG_FILE = document.getElementById('logFileInput').value;
  document.getElementById('log-path').textContent = LOG_FILE;
  loadData();
}
function updateCostRate() {
  COST_PER_DOLLAR = parseFloat(document.getElementById('costRateInput').value) || 1000000;
  loadData();
}

// 加载 JSONL 数据
async function loadData() {
  try {
    const response = await fetch(LOG_FILE + '?t=' + Date.now());
    if (!response.ok) {
      showEmpty('暂无日志数据。请先通过 ai_client.py 发起 AI 调用以生成日志。');
      return;
    }
    const text = await response.text();
    const lines = text.trim().split('\n').filter(l => l.trim());
    const records = lines.map(line => {
      try { return JSON.parse(line); } catch(e) { return null; }
    }).filter(r => r !== null);

    if (records.length === 0) {
      showEmpty('暂无日志数据。请先通过 ai_client.py 发起 AI 调用以生成日志。');
      return;
    }

    document.getElementById('total-records').textContent = records.length;
    renderOverview(records);
    renderRanking(records);
    renderTrend(records);
  } catch (e) {
    showEmpty('暂无日志数据。请先通过 ai_client.py 发起 AI 调用以生成日志。');
  }
}

function showEmpty(msg) {
  document.getElementById('total-records').textContent = '0';
  document.getElementById('ranking-body').innerHTML = '<tr><td colspan="6" class="empty">' + msg + '</td></tr>';
  const canvas = document.getElementById('trendChart');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = '14px sans-serif';
  ctx.fillStyle = '#888';
  ctx.textAlign = 'center';
  ctx.fillText(msg, canvas.width / 2, canvas.height / 2);
}

function renderOverview(records) {
  const totalTokens = records.reduce((s, r) => s + (r.total_tokens || 0), 0);
  const promptTokens = records.reduce((s, r) => s + (r.prompt_tokens || 0), 0);
  const completionTokens = records.reduce((s, r) => s + (r.completion_tokens || 0), 0);
  const totalCost = totalTokens / COST_PER_DOLLAR;
  const totalCalls = records.length;
  const successCalls = records.filter(r => r.status === 'success').length;
  const errorCalls = records.filter(r => r.status === 'error').length;
  const successRecords = records.filter(r => r.status === 'success');
  const avgLatency = successRecords.length > 0
    ? successRecords.reduce((s, r) => s + (r.latency_seconds || 0), 0) / successRecords.length
    : 0;

  document.getElementById('total-calls').textContent = totalCalls.toLocaleString();
  document.getElementById('calls-delta').textContent = '成功 ' + successCalls.toLocaleString() + ' / 失败 ' + errorCalls.toLocaleString();
  document.getElementById('total-tokens').textContent = totalTokens.toLocaleString();
  document.getElementById('tokens-delta').textContent = '输入 ' + promptTokens.toLocaleString() + ' + 输出 ' + completionTokens.toLocaleString();
  document.getElementById('total-cost').textContent = '$' + totalCost.toFixed(4);
  document.getElementById('avg-latency').textContent = avgLatency.toFixed(2) + 's';
}

function renderRanking(records) {
  const agentMap = {};
  records.forEach(r => {
    const id = r.agent_id || 'unknown';
    if (!agentMap[id]) {
      agentMap[id] = { agent_id: id, total_tokens: 0, total_cost: 0, call_count: 0, total_latency: 0, latency_count: 0 };
    }
    agentMap[id].total_tokens += r.total_tokens || 0;
    agentMap[id].total_cost += (r.total_tokens || 0) / COST_PER_DOLLAR;
    agentMap[id].call_count += 1;
    if (r.latency_seconds && r.status === 'success') {
      agentMap[id].total_latency += r.latency_seconds;
      agentMap[id].latency_count += 1;
    }
  });

  const agents = Object.values(agentMap).sort((a, b) => b.total_tokens - a.total_tokens).slice(0, 5);

  const tbody = document.getElementById('ranking-body');
  tbody.innerHTML = agents.map((a, i) => {
    const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'rank-other';
    const avgLatency = a.latency_count > 0 ? (a.total_latency / a.latency_count).toFixed(2) : '-';
    return '<tr>' +
      '<td><span class="rank ' + rankClass + '">' + (i + 1) + '</span></td>' +
      '<td><code>' + escapeHtml(a.agent_id) + '</code></td>' +
      '<td>' + a.total_tokens.toLocaleString() + '</td>' +
      '<td>$' + a.total_cost.toFixed(4) + '</td>' +
      '<td>' + a.call_count.toLocaleString() + '</td>' +
      '<td>' + avgLatency + '</td>' +
    '</tr>';
  }).join('');
}

function renderTrend(records) {
  const now = Date.now() / 1000;
  const hours24Ago = now - 24 * 3600;
  const recent = records.filter(r => r.timestamp >= hours24Ago);

  if (recent.length === 0) {
    const canvas = document.getElementById('trendChart');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#888';
    ctx.textAlign = 'center';
    ctx.fillText('过去 24 小时内暂无调用记录', canvas.width / 2, canvas.height / 2);
    return;
  }

  // 按小时聚合
  const hourly = {};
  for (let i = 0; i < 24; i++) {
    const h = Math.floor(now / 3600) - 23 + i;
    hourly[h] = { hour: h, prompt: 0, completion: 0, total: 0 };
  }
  recent.forEach(r => {
    const h = Math.floor(r.timestamp / 3600);
    if (hourly[h]) {
      hourly[h].prompt += r.prompt_tokens || 0;
      hourly[h].completion += r.completion_tokens || 0;
      hourly[h].total += r.total_tokens || 0;
    }
  });

  const data = Object.values(hourly).sort((a, b) => a.hour - b.hour);
  const labels = data.map(d => {
    const date = new Date(d.hour * 3600 * 1000);
    return (date.getMonth() + 1) + '/' + date.getDate() + ' ' + String(date.getHours()).padStart(2, '0') + ':00';
  });

  drawChart(labels, data.map(d => d.prompt), data.map(d => d.completion), data.map(d => d.total));
}

function drawChart(labels, promptData, completionData, totalData) {
  const canvas = document.getElementById('trendChart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const w = rect.width, h = rect.height;
  const padding = { top: 20, right: 20, bottom: 50, left: 60 };
  const chartW = w - padding.left - padding.right;
  const chartH = h - padding.top - padding.bottom;

  ctx.clearRect(0, 0, w, h);

  const maxVal = Math.max.apply(null, totalData.concat([1]));
  const n = labels.length;

  // 网格线
  ctx.strokeStyle = '#eee';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const y = padding.top + chartH * (i / 5);
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(w - padding.right, y);
    ctx.stroke();

    ctx.fillStyle = '#888';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxVal * (1 - i / 5)).toLocaleString(), padding.left - 8, y + 4);
  }

  // X轴标签（每3小时显示一个）
  ctx.fillStyle = '#888';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  labels.forEach((label, i) => {
    if (i % 3 === 0 || i === n - 1) {
      const x = padding.left + (i / (n - 1)) * chartW;
      ctx.fillText(label, x, h - padding.bottom + 18);
    }
  });

  // 绘制折线
  function drawLine(data, color, fill) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    data.forEach((val, i) => {
      const x = padding.left + (i / (n - 1)) * chartW;
      const y = padding.top + chartH * (1 - val / maxVal);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    if (fill) {
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.moveTo(padding.left, padding.top + chartH);
      data.forEach((val, i) => {
        const x = padding.left + (i / (n - 1)) * chartW;
        const y = padding.top + chartH * (1 - val / maxVal);
        ctx.lineTo(x, y);
      });
      ctx.lineTo(w - padding.right, padding.top + chartH);
      ctx.closePath();
      ctx.fill();
    }
  }

  drawLine(totalData, '#1a1a2e', 'rgba(26,26,46,0.05)');
  drawLine(promptData, '#ff6b6b', null);
  drawLine(completionData, '#48dbfb', null);

  // 图例
  const legendY = 10;
  const legends = [
    { label: '总 Tokens', color: '#1a1a2e' },
    { label: '输入 Tokens', color: '#ff6b6b' },
    { label: '输出 Tokens', color: '#48dbfb' },
  ];
  let legendX = w - padding.right - 200;
  legends.forEach(l => {
    ctx.fillStyle = l.color;
    ctx.fillRect(legendX, legendY, 12, 3);
    ctx.fillStyle = '#666';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(l.label, legendX + 18, legendY + 8);
    legendX += 80;
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 初始加载
loadData();

// 自动刷新（每 30 秒）
setInterval(loadData, 30000);
</script>

</body>
</html>
